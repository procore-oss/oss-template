name: "Pull Request Labeler"
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@70db055cd5ecb1019ed363a581f7208437960ec3 # (latest, untagged)
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
