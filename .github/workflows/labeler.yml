name: "Pull Request Labeler"
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bb8f002e4f8015d017de7c01b983424cb4c6de3f # (latest, untagged)
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
