name: "Pull Request Labeler"
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@5838aad63e8e46af22758862f67443ec3004377f # (latest, untagged)
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
